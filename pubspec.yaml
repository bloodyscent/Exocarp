name: exocarp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  tflite_flutter: ^0.12.1
  image: ^4.9.2
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.7
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/Exocarp.png
    - assets/ai/exocarp_mango_disease_model.tflite
    - assets/ai/class_names.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Exocarp.png"